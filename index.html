<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>German Audio Reader</title>
    <link rel="stylesheet" href="styles.css?v=20260908161737491154">
  </head>
  <body>
    <main class="shell">
      <aside id="library" class="library" aria-label="Audio library">
        <div class="library-topbar">
          <button id="closeLibrary" class="close-library" type="button" aria-label="关闭目录">×</button>
        </div>
        <div class="brand">
          <p class="kicker">German audio</p>
          <h1>Audio Reader</h1>
        </div>
        <label class="search-label" for="search">Search</label>
        <input id="search" class="search" type="search" autocomplete="off" placeholder="Kapitel, 01-1, 水果...">
        <nav id="trackList" class="track-list" aria-label="Chapters and lessons"></nav>
      </aside>

      <div id="libraryBackdrop" class="library-backdrop" hidden></div>

      <section class="reader" aria-live="polite">
        <header class="reader-header">
          <button id="openLibrary" class="menu-button" type="button" aria-label="打开目录" aria-controls="library" aria-expanded="false">
            <span aria-hidden="true">☰</span>
            <span>目录</span>
          </button>
          <div>
            <p class="kicker">Now playing</p>
            <h2 id="trackTitle">Loading...</h2>
            <p id="trackPosition" class="track-position"></p>
          </div>
          <div class="nav-buttons">
            <button id="previousTrack" type="button" aria-label="Previous track">Prev</button>
            <button id="nextTrack" type="button" aria-label="Next track">Next</button>
          </div>
        </header>

        <audio id="audioPlayer" class="audio" controls preload="metadata"></audio>

        <article class="transcript-panel">
          <div class="transcript-heading">
            <div>
              <p class="kicker">Read along</p>
              <h3>Transcript</h3>
            </div>
            <span id="transcriptCount" class="transcript-count"></span>
          </div>
          <div id="transcript" class="transcript" aria-live="polite">
            <p class="transcript-status">Loading transcript...</p>
          </div>
        </article>
      </section>
    </main>

    <script src="app.js?v=20260908161737491154"></script>
  </body>
</html>
