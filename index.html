<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>German Audio Reader</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <aside class="library" aria-label="Audio library">
        <div class="brand">
          <img class="cover" src="book.png" alt="" onerror="this.remove()">
          <div>
            <p class="kicker">German audio</p>
            <h1>Audio Reader</h1>
          </div>
        </div>
        <label class="search-label" for="search">Search</label>
        <input id="search" class="search" type="search" autocomplete="off" placeholder="01-1">
        <ol id="trackList" class="track-list"></ol>
      </aside>

      <section class="reader" aria-live="polite">
        <header class="reader-header">
          <div>
            <p class="kicker">Now playing</p>
            <h2 id="trackTitle">Loading...</h2>
          </div>
          <div class="nav-buttons">
            <button id="previousTrack" type="button" aria-label="Previous track">Prev</button>
            <button id="nextTrack" type="button" aria-label="Next track">Next</button>
          </div>
        </header>

        <audio id="audioPlayer" class="audio" controls preload="metadata"></audio>

        <article class="transcript-panel">
          <h3>Transcript</h3>
          <pre id="transcript" class="transcript">Loading transcript...</pre>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
